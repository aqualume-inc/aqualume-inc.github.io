name: Refresh Tirol water data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/update_water.py', '.github/workflows/water-data.yml']
  schedule:
    - cron: '23 4 * * *'
permissions:
  contents: write
  pages: write
concurrency:
  group: water-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate data; patch application
        run: python scripts/update_water.py
      - name: Commit data and application changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/tirol-water.json index.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified-format OSM snapshot and static-data application'
            git push origin HEAD:main
          fi
      - name: Request Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds
